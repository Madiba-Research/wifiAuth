plugins {
    id "java-library"
}

def sdkDir = null
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    def props = new Properties()
    localPropertiesFile.withInputStream { props.load(it) }
    sdkDir = props.getProperty("sdk.dir")
}
if (sdkDir == null) {
    sdkDir = System.getenv("ANDROID_HOME")
}
if (sdkDir == null) {
    sdkDir = System.getenv("ANDROID_SDK_ROOT")
}
if (sdkDir == null) {
    throw new GradleException("Set sdk.dir in local.properties, ANDROID_HOME, or ANDROID_SDK_ROOT.")
}

def androidJar = file("${sdkDir}/platforms/android-35/android.jar")
if (!androidJar.exists()) {
    throw new GradleException("Missing ${androidJar}. Install Android SDK platform 35 or update hiddenapi-stubs/build.gradle.")
}

dependencies {
    compileOnly files(androidJar)
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
