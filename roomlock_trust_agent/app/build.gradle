plugins {
    id "com.android.application"
}

android {
    namespace "com.roomlock.trust"
    compileSdk 35

    defaultConfig {
        applicationId "com.roomlock.trust"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly project(":hiddenapi-stubs")
}
